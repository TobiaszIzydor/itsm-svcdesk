# ai-generated: 70% - Claude Code wrote the rules from my design (symptoms, thresholds, severities and grouping are mine)
# prometheus/demo-alerts.yml - symptom alerts on the shop (INCIDENT-SPEC.md I-01, I-02, I-05).
# Symptoms, not causes: what the shop's users feel - checkout failing or slow (P1, pages), the front end failing (P2)
# or slow (P3, chat). Only SERVER spans count (what a service answered its callers); windows are [5m] because the
# span metrics arrive once a minute; durations are in milliseconds. No seeded_* series anywhere (I-02).
# One group, no interval: inside one group equal starts go to the most severe alert. Every rule carries
# system: shop, the label the inhibit rule of alertmanager.yml lists in `equal`.
groups:
  - name: shop-symptoms
    rules:
      - alert: CheckoutErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.05
        for: 1m
        labels:
          service: checkout
          severity: P1
          system: shop
        annotations:
          summary: "More than 5 % of checkout requests fail (5m): orders are being lost"
      - alert: CheckoutLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 2000
        for: 1m
        labels:
          service: checkout
          severity: P1
          system: shop
        annotations:
          summary: "Checkout p95 above 2 s (5m): orders are slow or timing out"
      - alert: FrontendErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.03
        for: 2m
        labels:
          service: frontend
          severity: P2
          system: shop
        annotations:
          summary: "More than 3 % of frontend requests fail (5m)"
      - alert: FrontendLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 300
        for: 2m
        labels:
          service: frontend
          severity: P3
          system: shop
        annotations:
          summary: "Frontend p95 above 300 ms (5m): pages are slow"
