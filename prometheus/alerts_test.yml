# ai-generated: 70% - Claude Code wrote the tests and found the edges with promtool; the burns and what must hold are my design
# prometheus/alerts_test.yml - promtool unit tests of alerts.yml (MONITORING-SPEC.md M-20, M-21). Run from the
# repository root:
#   docker run --rm -v "${PWD}/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts_test.yml
#
# /kb/search gets 10 requests per second (600 per minute). For every alert: healthy history longer than its long
# window, then a sustained burn at about twice its burn rate, asserted on both edges - NOT firing one evaluation
# before the first firing evaluation (kills `for - 5m` and `threshold / 1.5`) and firing at it (kills `for + 5m`
# and `threshold x 1.5`). The edges were found with promtool itself, by asserting every minute of the window.
# A second test per alert burns at 0.8 x the threshold for three long windows and must never fire (kills
# `threshold / 1.5` again, independently of the timing). A 5xx series on another route is noise the rules must
# ignore (the route filter).
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # KbSearchErrorsBurnFast (14.4 x, 1h / 5m, for 2m). Healthy for 70 minutes, then 173 of 600 requests per minute
  # fail (28.8 % = 2 x 14.4 %). First firing evaluation: 102m.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42427+427x119'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 173+173x119'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/tickets/{id}", http_response_status_code="502"}'
        values: '0+600x190'
    alert_rule_test:
      - eval_time: 70m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 101m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 102m
        alertname: KbSearchErrorsBurnFast
        exp_alerts:
          - exp_labels: {service: svcdesk, slo: availability, severity: P1}
            exp_annotations:
              summary: "/kb/search: over 14.4 % of searches failing (1h and 5m); 28-day error budget gone in ~2 days. Check kb-index first."

  # KbSearchErrorsBurnFast must stay quiet at 0.8 x its threshold: 69 of 600 per minute (11.5 % < 14.4 %) for 3h.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+531x180'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+69x180'
    alert_rule_test:
      - eval_time: 1h
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 1h30m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 2h
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 2h30m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 3h
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []

  # KbSearchErrorsBurnSlow (6 x, 6h / 30m, for 2m). Healthy for 370 minutes, then 72 of 600 requests per minute
  # fail (12 % = 2 x 6 %). First firing evaluation: 552m (9h12m).
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222528+528x420'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 72+72x420'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/tickets/{id}", http_response_status_code="502"}'
        values: '0+600x790'
    alert_rule_test:
      - eval_time: 370m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 551m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 552m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts:
          - exp_labels: {service: svcdesk, slo: availability, severity: P2}
            exp_annotations:
              summary: "/kb/search: over 6 % of searches failing (6h and 30m); 28-day error budget gone in ~5 days. Fix in working hours."

  # KbSearchErrorsBurnSlow must stay quiet at 0.8 x its threshold: 29 of 600 per minute (4.8 % < 6 %) for 18h.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+571x1080'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0+29x1080'
    alert_rule_test:
      - eval_time: 6h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 7h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 9h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 12h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 15h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 18h
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
