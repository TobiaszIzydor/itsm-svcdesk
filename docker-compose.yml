# Lab 1 compose contract (API.md section 9): a service named exactly "svcdesk", port 8080 inside the
# container, SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need no
# network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"               # local development; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # enables the X-Test-Clock header (API.md section 8)
      SVCDESK_DB: /data/svcdesk.db
      KB_INDEX_URL: http://kb-index:8080   # Lab 3 (M-02): the upstream of GET /kb/search
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume, never a bind mount (check 1.02)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Lab 3 (M-01): the upstream index, its latency profile derived from the GitHub login. No healthcheck: the
  # image has no shell, so a command-based check never passes (L3-CORE-1.04). No bind mounts (L3-CORE-1.02).
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: TobiaszIzydor
    ports:
      - "8081:8080"               # local only: /stats and /admin/degrade from the laptop
    restart: unless-stopped

  # Lab 3: my own Prometheus and Grafana, never started by the checker. Their configuration is baked into the
  # image (prometheus/Dockerfile, grafana/Dockerfile) instead of bind-mounted, so no service has a bind mount;
  # after a config change: docker compose --profile observability up -d --build
  prometheus:
    build: ./prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    build: ./grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    restart: unless-stopped

  # Lab 3 Stretch 2 (M-30): Toxiproxy in front of svcdesk. docker compose --profile gap up -d toxiproxy
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"               # the API
      - "8666:8666"               # the proxy in front of svcdesk

  # Stretch S3 (own tests): docker compose --profile tests run --rm --build tests
  tests:
    build:
      context: ./tests
    profiles: ["tests"]
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # the runner reads the service URL from this variable

volumes:
  svcdesk-data:
