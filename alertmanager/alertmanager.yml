# ai-generated: 70% - Claude Code wrote the tree from my design (P1 pages, P2 and P3 to chat, P1 mutes P2/P3 of the same system)
# alertmanager/alertmanager.yml - the routing tree (INCIDENT-SPEC.md I-04 to I-08).
# P1 goes to the pager (the on-call's phone), P2 and P3 to chat; anything that matches no child ends at the root,
# chat. While a P1 of a system fires, the P2 and P3 alerts of the same system are muted: they are usually the same
# incident seen from further away, and the person paged needs one notification, not four.
global:
  resolve_timeout: 5m
route:
  receiver: chat                  # the root: every alert enters here, and one that matches no child ends here
  group_by: [alertname, service]
  group_wait: 10s                 # the first notification of a new group waits this long: it is part of the MTTA
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity=~"P2|P3"']
      receiver: chat
receivers:
  - name: pager                   # the on-call's phone: http://localhost:18091 shows what reached it
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  # A P1 of a system mutes that system's P2 and P3. `equal: [system]`: only alerts of the same system; a label
  # missing from both alerts would count as equal, which the inhibited: false case of routing-tests.yml catches.
  - source_matchers: ['severity="P1"', 'system="shop"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [system]
